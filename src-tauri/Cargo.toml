[package]
name = "etichette-studio"
version = "1.1.0"
description = "Generatore offline di etichette e codici a barre"
edition = "2021"
authors = ["NIS"]
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
resvg = "0.45"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "tiff", "bmp", "gif", "avif"] }
lopdf = "0.38"
svgtypes = "0.15"
base64 = "0.22"
png = "0.18"
tiff = "0.11"
webview2-com = "0.39"
windows-core = "0.62"
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy", "zip"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
